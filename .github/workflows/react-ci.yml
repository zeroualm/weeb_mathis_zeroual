name: CI pour le projet Weeb (front)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lancer les tests et le linting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: 1. Checkout du code
        uses: actions/checkout@v7.0.1

      - name: 2. Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: 3. Cache des dépendances npm
        uses: actions/cache@v5.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 4. Installation des dépendances
        run: npm ci

      - name: 5. Exécution des tests
        run: npm test
